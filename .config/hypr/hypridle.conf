general {
    lock_cmd = pidof hyprlock || hyprlock       # Allows manual locking
    before_sleep_cmd = loginctl lock-session    # Locks if you manually suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Wakes monitor if you manually suspend
}

# All 'listener' blocks have been removed. 
# The system will now never dim, lock, or sleep automatically.
